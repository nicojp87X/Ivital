<style>
  :root{
    /* COLORES OFICIALES DE MARCA IVITAL */
    --navy:#2A4367;
    --navy-mid:#3D5E8E;
    --navy-deep:#1e3050;
    --cream:#EDE3D1;
    --cream-light:#F5EEDC;
    --cream-dark:#DDD1B8;

    /* Auxiliares */
    --ink:var(--navy);
    --ink-mute:rgba(42,67,103,.62);
    --line:rgba(42,67,103,.16);
    --shadow:rgba(42,67,103,.18);

    /* Tipografías oficiales */
    --serif:"Lora", Georgia, "Times New Roman", serif;
    --sans:"Noto Sans", -apple-system, system-ui, sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      linear-gradient(165deg,var(--cream-light) 0%,var(--cream) 55%,var(--cream-dark) 100%);
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
    overflow:hidden;
    position:relative;
    min-height:100vh;
    min-height:100svh;
    letter-spacing:0.01em;
  }

  /* Textura sutil */
  body::before{
    content:"";position:fixed;inset:0;
    background:
      radial-gradient(circle at 12% 18%, rgba(42,67,103,.06) 0%, transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(61,94,142,.05) 0%, transparent 48%);
    pointer-events:none;z-index:0;
  }

  /* Corner brackets sutiles */
  .corner{
    position:fixed;width:68px;height:68px;pointer-events:none;z-index:2;
    animation:fadeIn 1.4s ease .2s both;
  }
  .corner.tl{top:36px;left:36px;border-top:1.5px solid var(--navy);border-left:1.5px solid var(--navy);opacity:.45}
  .corner.tr{top:36px;right:36px;border-top:1.5px solid var(--navy);border-right:1.5px solid var(--navy);opacity:.45}
  .corner.bl{bottom:36px;left:36px;border-bottom:1.5px solid var(--navy);border-left:1.5px solid var(--navy);opacity:.45}
  .corner.br{bottom:36px;right:36px;border-bottom:1.5px solid var(--navy);border-right:1.5px solid var(--navy);opacity:.45}

  @media (max-width:640px){
    .corner{width:44px;height:44px}
    .corner.tl,.corner.tr{top:22px}
    .corner.tl,.corner.bl{left:22px}
    .corner.tr,.corner.br{right:22px}
    .corner.bl,.corner.br{bottom:22px}
  }

  main{
    position:relative;z-index:1;
    height:100vh;height:100svh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:60px 24px;
    text-align:center;
    gap:38px;
  }

  /* LOGO */
  .brand{
    animation:fadeUp 1s ease .1s both;
    max-width:340px;
    width:70%;
  }
  .brand img{
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 4px 20px rgba(42,67,103,.08));
  }

  /* Divider dorado sutil */
  .divider{
    display:flex;align-items:center;justify-content:center;gap:16px;
    animation:fadeUp 1s ease .4s both;
  }
  .divider .line{width:72px;height:1px;background:var(--navy-mid);opacity:.5}
  .divider .diamond{
    width:6px;height:6px;background:var(--navy-mid);
    transform:rotate(45deg);opacity:.7;
  }

  /* Título construcción */
  .status{
    animation:fadeUp 1s ease .55s both;
  }
  .status h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(30px,4.4vw,50px);
    color:var(--navy);
    letter-spacing:-.005em;
    line-height:1.18;
    margin-bottom:16px;
  }
  .status h1 em{
    font-style:italic;
    font-weight:500;
    color:var(--navy-mid);
  }
  .status p{
    font-family:var(--sans);
    font-size:clamp(14px,1.4vw,16px);
    color:var(--ink-mute);
    font-weight:300;
    max-width:520px;
    margin:0 auto;
    line-height:1.75;
  }

  /* Contacto */
  .contact{
    animation:fadeUp 1s ease .75s both;
    display:flex;flex-wrap:wrap;justify-content:center;
    gap:12px;
    max-width:640px;
  }
  .contact a{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 22px;
    background:rgba(42,67,103,.04);
    border:1px solid var(--line);
    border-radius:99px;
    font-family:var(--sans);
    font-size:13px;
    font-weight:500;
    color:var(--navy);
    text-decoration:none;
    letter-spacing:.02em;
    transition:.28s cubic-bezier(.2,.7,.2,1);
  }
  .contact a:hover{
    background:var(--navy);color:var(--cream);
    border-color:var(--navy);
    transform:translateY(-2px);
    box-shadow:0 12px 30px var(--shadow);
  }
  .contact a.primary{
    background:var(--navy);color:var(--cream);
    border-color:var(--navy);
  }
  .contact a.primary:hover{background:var(--navy-deep)}
  .contact svg{width:16px;height:16px;flex-shrink:0}

  /* Ubicación */
  .location{
    animation:fadeUp 1s ease .95s both;
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--ink-mute);
    font-weight:500;
  }
  .location small{
    display:block;margin-top:8px;
    letter-spacing:.05em;font-size:12px;
    color:rgba(42,67,103,.45);
    text-transform:none;
    font-weight:400;
  }

  /* Tagline final */
  .tagline{
    animation:fadeUp 1s ease 1.15s both;
    font-family:var(--serif);
    font-style:italic;
    font-size:16px;
    color:var(--navy-mid);
    font-weight:500;
    letter-spacing:.01em;
    opacity:.85;
  }

  /* Animaciones */
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }

  @media (max-width:640px){
    main{gap:26px;padding:40px 20px}
    .brand{width:80%;max-width:280px}
    .contact{gap:10px}
    .contact a{padding:12px 18px;font-size:12.5px}
    .location{font-size:10px;letter-spacing:.22em}
    .tagline{font-size:14px}
  }
</style>
