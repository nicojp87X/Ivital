name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: FTP Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar HTML
        run: |
          for f in index.html programa-tierra.html aviso-legal.html privacidad.html cookies.html .htaccess; do
            test -f "$f" || { echo "FALTA: $f"; exit 1; }
          done
          echo "Archivos clave presentes"

      - name: Deploy por FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.netlify/**
            **/Publicaciones/**
            **/Publicaciones_pendientes/**
            **/Fotos/**
            **/reference/**
            **/Landing/**
            **/distribucion-belevels/**
            *.md
            *.py
            _redirects
            netlify.toml
