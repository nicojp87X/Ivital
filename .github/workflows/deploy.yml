name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: FTP Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar HTML
        run: |
          for f in index.html aviso-legal.html privacidad.html cookies.html; do
            test -f "$f" || { echo "FALTA: $f"; exit 1; }
          done
          echo "Todos los HTML presentes"

      - name: Deploy por FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/Fotos/**
            **/Publicaciones_pendientes/**
            **/Landing/**
            **/CLAUDE.md
            **/CONTEXT.md
            **/ideas para implementar en la web.md
            **/README.md
            **/.gitignore
