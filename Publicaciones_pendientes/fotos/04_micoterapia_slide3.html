<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Micoterapia - Ivital Salud Integral - Slide 3</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-bg-start: #F5F0E8;
      --color-bg-end: #EDE8DD;
      --color-navy: #1a365d;
      --color-navy-light: #2a4a7f;
      --color-accent: #4a7c59;
      --color-accent-warm: #8B6914;
      --color-whatsapp: #25D366;
      --color-white-glass: rgba(255, 255, 255, 0.72);
      --color-white-glass-border: rgba(255, 255, 255, 0.9);
      --font-serif: Georgia, 'Times New Roman', serif;
      --font-sans: system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    body {
      background: linear-gradient(145deg, var(--color-bg-start) 0%, var(--color-bg-end) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-family: var(--font-sans);
    }

    /* Background decorative elements */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .bg-circle--1 {
      width: 640px;
      height: 640px;
      background: radial-gradient(circle, rgba(74,124,89,0.08) 0%, transparent 65%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .bg-circle--2 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(139,105,20,0.07) 0%, transparent 70%);
      top: -60px;
      right: -60px;
    }

    .bg-circle--3 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(26,54,93,0.06) 0%, transparent 70%);
      bottom: -40px;
      left: -40px;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(26,54,93,0.04) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
    }

    /* Brand header */
    .brand {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .brand__line {
      flex: 1;
      max-width: 180px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(26,54,93,0.25));
    }

    .brand__line--right {
      background: linear-gradient(to left, transparent, rgba(26,54,93,0.25));
    }

    .brand__name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-navy);
      opacity: 0.6;
    }

    /* Main layout */
    .slide {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 80px 110px;
      gap: 0;
      text-align: center;
    }

    /* Mushroom decoration top */
    .deco-mushrooms {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }

    .deco-mushrooms span {
      font-size: 36px;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(74,124,89,0.2));
    }

    .deco-mushrooms span:nth-child(2) {
      font-size: 54px;
    }

    /* CTA card container */
    .cta-card {
      background: var(--color-white-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--color-white-glass-border);
      border-radius: 28px;
      padding: 52px 72px 56px;
      box-shadow: 0 8px 48px rgba(26,54,93,0.09), 0 2px 8px rgba(26,54,93,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
      margin-bottom: 36px;
    }

    .cta-eyebrow {
      display: inline-block;
      background: rgba(74, 124, 89, 0.1);
      border: 1px solid rgba(74, 124, 89, 0.22);
      border-radius: 40px;
      padding: 5px 20px;
      margin-bottom: 24px;
    }

    .cta-eyebrow span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--color-accent);
    }

    .cta-title {
      font-family: var(--font-serif);
      font-size: 56px;
      font-weight: bold;
      color: var(--color-navy);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .cta-title em {
      font-style: italic;
      color: var(--color-accent);
    }

    .cta-subtitle {
      font-size: 20px;
      color: var(--color-navy);
      opacity: 0.72;
      line-height: 1.5;
      max-width: 520px;
      margin-bottom: 44px;
    }

    /* CTA Buttons */
    .buttons {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 18px 36px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      border: none;
      cursor: default;
      line-height: 1;
      white-space: nowrap;
    }

    .btn--whatsapp {
      background: var(--color-whatsapp);
      color: #fff;
      box-shadow: 0 6px 24px rgba(37,211,102,0.32);
    }

    .btn--visit {
      background: var(--color-navy);
      color: #fff;
      box-shadow: 0 6px 24px rgba(26,54,93,0.22);
    }

    .btn__icon {
      font-size: 20px;
      line-height: 1;
    }

    /* Info row */
    .info-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .info-item__icon {
      font-size: 22px;
      line-height: 1;
    }

    .info-item__label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-navy);
      opacity: 0.6;
      letter-spacing: 0.04em;
    }

    .info-item__value {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-navy);
    }

    .info-divider {
      width: 1px;
      height: 40px;
      background: rgba(26,54,93,0.15);
    }

    /* Big tagline footer */
    .tagline-big {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .tagline-big__text {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-navy);
      opacity: 0.35;
    }

    .tagline-big__line {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--color-accent), var(--color-accent-warm));
      border-radius: 2px;
      margin-top: 10px;
      opacity: 0.5;
    }

    /* Slide indicator */
    .slide-indicator {
      position: absolute;
      bottom: 48px;
      right: 56px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(26,54,93,0.2);
    }

    .dot--active {
      background: var(--color-navy);
      width: 24px;
      border-radius: 4px;
    }

    /* WhatsApp icon SVG inline */
    .icon-wa {
      display: inline-block;
      width: 20px;
      height: 20px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="bg-circle bg-circle--1"></div>
  <div class="bg-circle bg-circle--2"></div>
  <div class="bg-circle bg-circle--3"></div>

  <div class="slide">
    <div class="brand">
      <div class="brand__line"></div>
      <span class="brand__name">Ivital Salud Integral</span>
      <div class="brand__line brand__line--right"></div>
    </div>

    <div class="deco-mushrooms" aria-hidden="true">
      <span>&#127812;</span>
      <span>&#127812;</span>
      <span>&#127812;</span>
    </div>

    <div class="cta-card">
      <div class="cta-eyebrow"><span>Empieza hoy</span></div>

      <h1 class="cta-title">
        Descubre la micoterapia<br>
        en <em>Ivital</em>
      </h1>

      <p class="cta-subtitle">
        Te asesoramos seg&#250;n tus necesidades.<br>
        Encuentra el hongo que tu cuerpo necesita.
      </p>

      <div class="buttons">
        <div class="btn btn--whatsapp" role="img" aria-label="Escríbenos por WhatsApp">
          <svg class="btn__icon icon-wa" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          Escr&#237;benos
        </div>

        <div class="btn btn--visit" role="img" aria-label="Visítanos en tienda">
          <span class="btn__icon" aria-hidden="true">&#127968;</span>
          V&#237;sitanos
        </div>
      </div>
    </div>

    <div class="info-row" aria-label="Información de contacto">
      <div class="info-item">
        <span class="info-item__icon" aria-hidden="true">&#128205;</span>
        <span class="info-item__label">D&#243;nde estamos</span>
        <span class="info-item__value">Herbolario Ivital</span>
      </div>
      <div class="info-divider"></div>
      <div class="info-item">
        <span class="info-item__icon" aria-hidden="true">&#128142;</span>
        <span class="info-item__label">Asesoramiento</span>
        <span class="info-item__value">Personalizado</span>
      </div>
      <div class="info-divider"></div>
      <div class="info-item">
        <span class="info-item__icon" aria-hidden="true">&#127812;</span>
        <span class="info-item__label">Especialistas en</span>
        <span class="info-item__value">Micoterapia</span>
      </div>
    </div>

    <div class="tagline-big" aria-label="Tagline: Cuídate desde dentro">
      <span class="tagline-big__text">Cu&#237;date desde dentro</span>
      <div class="tagline-big__line"></div>
    </div>

    <div class="slide-indicator" aria-label="Slide 3 de 3">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot dot--active"></div>
    </div>
  </div>
</body>
</html>
