<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  body {
    background: linear-gradient(155deg, #1a365d 0%, #234578 40%, #2d5a8e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    color: #F5F0E8;
  }

  /* Círculos decorativos de fondo */
  .bg-circle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .bg-circle-1 {
    width: 600px; height: 600px;
    top: -150px; right: -100px;
    background: radial-gradient(circle, rgba(245,240,232,0.06) 0%, transparent 70%);
  }
  .bg-circle-2 {
    width: 400px; height: 400px;
    bottom: -80px; left: -60px;
    background: radial-gradient(circle, rgba(196,164,74,0.08) 0%, transparent 70%);
  }

  /* Esquinas decorativas */
  .corner {
    position: absolute;
    width: 60px; height: 60px;
    pointer-events: none;
  }
  .corner-tl { top: 40px; left: 40px; border-top: 2px solid rgba(196,164,74,0.5); border-left: 2px solid rgba(196,164,74,0.5); }
  .corner-tr { top: 40px; right: 40px; border-top: 2px solid rgba(196,164,74,0.5); border-right: 2px solid rgba(196,164,74,0.5); }
  .corner-bl { bottom: 40px; left: 40px; border-bottom: 2px solid rgba(196,164,74,0.5); border-left: 2px solid rgba(196,164,74,0.5); }
  .corner-br { bottom: 40px; right: 40px; border-bottom: 2px solid rgba(196,164,74,0.5); border-right: 2px solid rgba(196,164,74,0.5); }

  /* Contenido principal */
  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    z-index: 1;
    padding: 0 80px;
    gap: 0;
  }

  .eyebrow {
    font-size: 16px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(196,164,74,0.9);
    margin-bottom: 40px;
    font-weight: 500;
  }

  .sign-photo {
    width: 820px;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
    margin-bottom: 50px;
    border: 3px solid rgba(245,240,232,0.15);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 36px;
  }
  .divider-line {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(196,164,74,0.6), transparent);
  }
  .divider-diamond {
    width: 8px; height: 8px;
    background: rgba(196,164,74,0.7);
    transform: rotate(45deg);
  }

  .lema {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 46px;
    font-weight: 700;
    line-height: 1.25;
    color: #F5F0E8;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
  }
  .lema em {
    font-style: italic;
    color: #C4A44A;
  }

  .subtitle {
    font-size: 20px;
    color: rgba(245,240,232,0.7);
    font-weight: 400;
    letter-spacing: 1px;
    margin-bottom: 40px;
  }

  .location {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(245,240,232,0.1);
    backdrop-filter: blur(10px);
    padding: 14px 28px;
    border-radius: 100px;
    font-size: 17px;
    color: rgba(245,240,232,0.85);
    border: 1px solid rgba(245,240,232,0.12);
  }
  .location-dot {
    width: 8px; height: 8px;
    background: #C4A44A;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .tagline {
    position: absolute;
    bottom: 48px;
    font-size: 14px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(245,240,232,0.4);
    font-weight: 500;
  }
</style>
</head>
