<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Mieles Yogé – Slide 1</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream-light: #F5F0E8;
      --cream-dark: #EDE8DD;
      --navy: #1a365d;
      --navy-light: #2a4a7f;
      --gold: #C8922A;
      --gold-light: #E8B84B;
      --text-secondary: #4a5568;
      --border-subtle: rgba(26, 54, 93, 0.12);
    }

    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    body {
      background: linear-gradient(145deg, var(--cream-light) 0%, var(--cream-dark) 100%);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Textura sutil de fondo */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(200, 146, 42, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(26, 54, 93, 0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .slide {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px;
      position: relative;
    }

    /* Marca de agua geométrica decorativa */
    .deco-hex {
      position: absolute;
      border: 1.5px solid rgba(200, 146, 42, 0.15);
      border-radius: 50%;
    }
    .deco-hex--1 {
      width: 420px;
      height: 420px;
      top: -80px;
      right: -80px;
    }
    .deco-hex--2 {
      width: 280px;
      height: 280px;
      bottom: 60px;
      left: -60px;
      border-color: rgba(26, 54, 93, 0.08);
    }

    /* Celdas de panal decorativas */
    .honeycomb-deco {
      position: absolute;
      top: 48px;
      right: 72px;
      display: grid;
      grid-template-columns: repeat(4, 18px);
      gap: 6px;
      opacity: 0.18;
    }
    .honeycomb-deco span {
      display: block;
      width: 18px;
      height: 18px;
      background: var(--gold);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }
    .honeycomb-deco span:nth-child(odd) {
      transform: translateY(12px);
    }

    .header-brand {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-brand::before,
    .header-brand::after {
      content: '';
      display: block;
      width: 36px;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
    }

    .main-content {
      text-align: center;
      max-width: 820px;
    }

    .eyebrow {
      font-family: system-ui, sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 28px;
    }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 68px;
      font-weight: bold;
      color: var(--navy);
      line-height: 1.12;
      letter-spacing: -0.01em;
      margin-bottom: 36px;
    }

    h1 em {
      font-style: italic;
      color: var(--gold);
    }

    .subtitle {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 26px;
      font-weight: 400;
      font-style: italic;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 64px;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--gold-light), var(--gold));
      margin: 0 auto 64px;
      border-radius: 2px;
    }

    .honey-icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 64px;
    }

    .honey-pill {
      background: rgba(200, 146, 42, 0.1);
      border: 1px solid rgba(200, 146, 42, 0.25);
      border-radius: 100px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 500;
      color: var(--navy);
      letter-spacing: 0.04em;
    }

    .swipe-cta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 500;
      color: var(--navy);
      letter-spacing: 0.06em;
      opacity: 0.7;
    }

    .swipe-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--navy);
      border-radius: 50%;
      font-size: 14px;
      opacity: 0.5;
    }

    .footer-tagline {
      position: absolute;
      bottom: 52px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: Georgia, serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--navy);
      opacity: 0.35;
    }

    .footer-logo {
      position: absolute;
      bottom: 52px;
      right: 80px;
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="slide">

    <div class="deco-hex deco-hex--1"></div>
    <div class="deco-hex deco-hex--2"></div>

    <div class="honeycomb-deco" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <p class="header-brand">Yogé Remedios Ancestrales</p>

    <main class="main-content">
      <p class="eyebrow">En Ivital Salud Integral</p>

      <h1>¿Conoces las mieles<br><em>artesanales</em> Yogé?</h1>

      <div class="divider"></div>

      <p class="subtitle">Remedios ancestrales<br>en cada cucharada</p>

      <div class="honey-icons" role="list" aria-label="Variedades disponibles">
        <div class="honey-pill" role="listitem">Miel Dorada 🍯</div>
        <div class="honey-pill" role="listitem">Miel de Jamaica 🌺</div>
        <div class="honey-pill" role="listitem">Miel Digestiva 🌿</div>
      </div>

      <div class="swipe-cta" aria-label="Desliza para descubrir">
        <span>Desliza para descubrir</span>
        <span class="swipe-arrow" aria-hidden="true">→</span>
      </div>
    </main>

    <p class="footer-tagline">Cuídate desde dentro</p>
    <p class="footer-logo">ivital</p>

  </div>
</body>
</html>
